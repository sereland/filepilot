name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Test rule editor validation
        run: npm test

      - name: Test rule engine and archive updates
        env:
          FILEPILOT_REQUIRE_SHORT_PATH_TEST: "1"
        run: |
          $taskExplorerKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
          $taskOriginalSetting = (Get-ItemProperty -Path $taskExplorerKey -ErrorAction SilentlyContinue).HideFileExt
          New-Item -Path $taskExplorerKey -Force | Out-Null
          try {
            foreach ($taskHideFileExt in @(1, 0)) {
              Set-ItemProperty -Path $taskExplorerKey -Name HideFileExt -Value $taskHideFileExt
              Write-Host "Test core with HideFileExt=$taskHideFileExt"
              cargo test --locked --manifest-path src-tauri/core/Cargo.toml -- --test-threads=1
              if ($LASTEXITCODE -ne 0) { throw "Core tests failed with HideFileExt=$taskHideFileExt" }
            }
          } finally {
            if ($null -eq $taskOriginalSetting) {
              Remove-ItemProperty -Path $taskExplorerKey -Name HideFileExt -ErrorAction SilentlyContinue
            } else {
              Set-ItemProperty -Path $taskExplorerKey -Name HideFileExt -Value $taskOriginalSetting
            }
          }

      # Tag 推送：走 tauri-action，构建并发布 GitHub Release
      - name: Build Tauri app and release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FilePilot ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install FilePilot."
          releaseDraft: false
          prerelease: false
          args: "--target x86_64-pc-windows-msvc"

      # 手动触发：只构建，把安装包作为 workflow artifact 上传，不建 Release
      - name: Build Tauri app (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Upload bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: filepilot-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
