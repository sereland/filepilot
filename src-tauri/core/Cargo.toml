[package]
name = "filepilot-core"
version = "0.1.0"
edition = "2021"
description = "FilePilot core: rule engine, file watcher, dry-run, operation log and undo. No Tauri dependency, fully unit-testable."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
notify-debouncer-mini = "0.7"
trash = "5"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_UI_Shell_PropertiesSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }
