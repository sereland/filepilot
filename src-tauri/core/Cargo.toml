[package]
name = "filepilot-core"
version = "0.1.0"
edition = "2021"
description = "FilePilot core: rule engine, file watcher, dry-run, operation log and undo. No Tauri dependency, fully unit-testable."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
notify-debouncer-mini = "0.7"
trash = "5"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
